<!DOCTYPE html>
<html lang=en>
<head><title>Resume</title>
<meta name=charset content=utf-8>
<meta name=viewport content="width=device-width, initial-scale=1.0">
<link rel=icon href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14'>🌅</text></svg>">
<link rel=stylesheet href=styles.css>
</head>
<body>
<button class=print-button type=button aria-label="Print Resume" title="Print Resume">🖨️</button>
<script src=content.js></script>
<script>
(function () {
  var R = window.RESUME;
  document.title = "Resume - " + R.name;

  // Build a DOM element. Text is set via textContent, so no escaping needed.
  function el(tag, text, cls) {
    var e = document.createElement(tag);
    if (text != null) e.textContent = text;
    if (cls){
      e.className = cls;
    }
    else {
      e.className = "rest";
    }
    return e;
  }
  function wrap(inner) { // <span>inner</span>
    var s = el("span");
    s.appendChild(inner);
    return s;
  }
  function list(items) {
    var ul = el("ul");
    items.forEach(function (t) { ul.appendChild(el("li", t)); });
    return ul;
  }
  function leftColRow(left, right) {
    var row = el("div", null, "row");
    row.appendChild(left);
    row.appendChild(right);
    return row;
  }

  var page = el("div", null, "page");

  // Name + contact
  page.appendChild(el("h1", R.name, "name"));
  var contact = el("h2");
  contact.appendChild(el("span", R.contact.location, "contact"));
  var email = el("a", R.contact.email, "contact");
  email.setAttribute("href", "mailto:" + R.contact.email);
  contact.appendChild(wrap(email));
  page.appendChild(contact);

  // Objective
  page.appendChild(el("h3", "OBJECTIVE", "category"));
  page.appendChild(el("hr"));
  page.appendChild(el("p", R.objective));

  // Education
  page.appendChild(el("h3", "EDUCATION", "category"));
  page.appendChild(el("hr"));
  R.education.forEach(function (edu) {
    var schoolRow = leftColRow(el("h4", edu.school), el("h4", edu.location));
    page.appendChild(schoolRow);
    var detailsRow = leftColRow(el("i", edu.details), wrap(el("i", edu.dates)));
    page.appendChild(detailsRow);
  });

  // Skills
  page.appendChild(el("h3", "SKILLS", "category"));
  page.appendChild(el("hr"));
  page.appendChild(el("h4", "Languages"));
  page.appendChild(list([R.skills.languages]));
  page.appendChild(el("h4", "Software"));
  page.appendChild(list([R.skills.software]));

  // Experience
  page.appendChild(el("h3", "EXPERIENCE", "category"));
  page.appendChild(el("hr"));
  R.experience.forEach(function (job) {
    var locations = [];
    job.roles.forEach(function (role) {
      if (locations.indexOf(role.location) === -1) locations.push(role.location);
    });
    page.appendChild(leftColRow(el("h4", job.company), el("h4", locations.join(", "))));
    job.roles.forEach(function (role) {
      page.appendChild(leftColRow(el("i", role.title), el("i", role.dates)));
      page.appendChild(list(role.bullets));
    });
  });

  // Projects
  page.appendChild(el("h3", "PROJECTS", "category"));
  page.appendChild(el("hr"));
  R.projects.forEach(function (p) {
    var row = el("span", null, "row");
    var left = el("h4");
    left.appendChild(el("span", p.title));
    row.appendChild(left);
    row.appendChild(wrap(el("i", p.dates)));
    row.className += " dates-right";
    page.appendChild(row);
    page.appendChild(list(p.bullets));
  });

  document.body.appendChild(page);
  document.querySelector(".print-button").addEventListener("click", function () {
    window.print();
  });
})();
</script>
</body></html>
